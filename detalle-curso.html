<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Curso | BotEduCarmen</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #f8fafc; font-family: 'Inter', sans-serif; margin: 0; }
        .details-hero {
            background: #0a192f;
            color: white;
            padding: 60px 20px;
            text-align: center;
            border-bottom: 4px solid #00d2ff;
        }
        .details-card {
            max-width: 800px;
            margin: -40px auto 50px;
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
        }
        .btn-accion {
            background: linear-gradient(135deg, #ff6d00, #ff9100);
            color: white;
            padding: 15px 35px;
            border-radius: 15px;
            border: none;
            font-weight: 800;
            cursor: pointer;
            font-size: 1.1rem;
            box-shadow: 0 8px 0 #b34b00;
            width: 100%;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="details-hero">
        <h1 id="curso-titulo" style="font-size:2.5rem; margin:0; color:#00d2ff;">Cargando...</h1>
        <p id="curso-duracion" style="opacity:0.8; margin-top:10px;"></p>
    </div>

    <div class="details-card">
        <img id="curso-imagen" style="width:100%; height:300px; object-fit:cover; border-radius:20px; margin-bottom:25px;" src="">
        <h3 style="color:#0a192f; font-size:1.5rem;">Descripción del Módulo</h3>
        <p id="curso-descripcion" style="color:#64748b; line-height:1.8; font-size:1.1rem;"></p>
        
        <div style="margin-top:30px; padding:20px; background:#f1f5f9; border-radius:15px; display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:bold; color:#0a192f;">Inversión:</span>
            <span id="curso-costo" style="color:#ff6d00; font-weight:800; font-size:1.4rem;"></span>
        </div>

        <button id="btn-seleccionar" class="btn-accion">SELECCIONAR E INSCRIBIRSE</button>
        <a href="cursos.html" style="display:block; text-align:center; margin-top:20px; color:#0a192f; font-weight:bold; text-decoration:none;">← Volver al catálogo</a>
    </div>

    <script src="main.js"></script>
    <script src="cursos.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const idCurso = params.get('id');
            const curso = obtenerCursoPorId(idCurso);

            if (!curso) {
                document.getElementById('curso-titulo').innerText = "Curso no encontrado";
                return;
            }

            document.getElementById('curso-titulo').innerText = curso.nombre;
            document.getElementById('curso-duracion').innerText = "⏱ Duración: " + curso.duracion;
            document.getElementById('curso-descripcion').innerText = curso.descripcion;
            document.getElementById('curso-costo').innerText = curso.costo;
            document.getElementById('curso-imagen').src = curso.imagen;

            document.getElementById('btn-seleccionar').addEventListener('click', () => {
                agregarAlCarrito(curso.nombre, curso.costo);
                window.location.href = 'contacto.html';
            });
        });
    </script>
</body>
</html>
