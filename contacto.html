<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos del Estudiante | BotEduCarmen</title>
    <style>
        :root {
            --bg-principal: #0a192f;
            --bg-nav: #e2e8f0; 
            --bg-card: rgba(16, 29, 56, 0.75);
            --texto-oscuro: #0a192f; 
            --texto-principal: #f8fafc;
            --texto-secundario: #94a3b8;
            --azul-electrico: #00d2ff;
            --naranja-neon: #ff6d00;
            --naranja-glow: #ff9100;
            --borde-cristal: rgba(0, 210, 255, 0.15);
            --borde-cristal-hover: rgba(0, 210, 255, 0.4);
        }

        body { 
            background-color: var(--bg-principal); 
            color: var(--texto-principal); 
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* BARRA SUPERIOR CONSTANTE IDENTICA */
        .top-bar {
            background: #050c18;
            color: var(--azul-electrico);
            padding: 10px 0;
            font-size: 0.85rem;
            letter-spacing: 1px;
            font-weight: 600;
            border-bottom: 2px solid var(--azul-electrico);
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.4);
        }
        .top-bar-content {
            display: flex;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 25px;
        }

        /* HEADER CON FONDO AZUL GRISÁCEO */
        header {
            background: var(--bg-nav);
            position: sticky; 
            top: 0; 
            z-index: 1000;
            padding: 15px 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            border-bottom: 2px solid var(--azul-electrico);
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        .header-brand { display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .header-brand img { height: 55px; }
        
        .header-brand h1 { 
            font-size: 1.6rem; 
            margin: 0; 
            color: var(--texto-oscuro); 
            font-weight: 800; 
        }
        .header-brand h1 span { 
            color: #1e3a8a; 
        }

        .nav-btn {
            background: var(--bg-principal);
            border: 2px solid var(--bg-principal);
            color: white;
            padding: 10px 24px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 700;
        }
        .nav-btn:hover { 
            background: transparent;
            color: var(--texto-oscuro);
            border-color: var(--texto-oscuro);
            transform: translateY(-2px);
        }

        /* CONTENEDOR DEL FORMULARIO */
        .form-wrapper {
            max-width: 650px;
            margin: 40px auto 60px;
            padding: 0 20px;
        }

        .form-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid var(--borde-cristal);
            padding: 35px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        .form-card h2 {
            margin: 0 0 10px;
            color: var(--azul-electrico);
            font-size: 1.8rem;
            text-align: center;
            font-weight: 800;
        }

        .form-card p {
            text-align: center;
            color: var(--texto-secundario);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        /* RESUMEN DE CURSOS SELECCIONADOS */
        .resumen-cursos {
            background: rgba(5, 12, 24, 0.6);
            border: 1px solid var(--borde-cristal);
            border-radius: 16px;
            padding: 15px 20px;
            margin-bottom: 25px;
        }
        .resumen-cursos h4 {
            margin: 0 0 10px;
            color: var(--azul-electrico);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .resumen-lista {
            margin: 0;
            padding-left: 20px;
            color: var(--texto-principal);
            font-size: 0.95rem;
        }

        /* GRUPO DE CAMPOS */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--texto-principal);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid var(--borde-cristal);
            background: rgba(10, 25, 47, 0.7);
            color: white;
            outline: none;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--azul-electrico);
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
        }

        /* BOTÓN ENVIAR FORMULARIO */
        .btn-enviar {
            background: linear-gradient(135deg, var(--naranja-neon), var(--naranja-glow));
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            width: 100%;
            font-weight: 800;
            font-size: 1rem;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 0 #b34b00, 0 10px 20px rgba(255, 109, 0, 0.3);
            transition: all 0.15s ease-in-out;
            margin-top: 10px;
        }

        .btn-enviar:hover {
            transform: translateY(2px);
            box-shadow: 0 4px 0 #b34b00, 0 6px 12px rgba(255, 109, 0, 0.35);
        }

        .btn-enviar:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #b34b00;
        }

        /* CHATBOT INTEGRADO */
        #chat-icon { 
            position: fixed; bottom: 30px; right: 30px; width: 75px; height: 75px; 
            cursor: pointer; z-index: 4000; animation: pulse 2s infinite; 
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

        #chat-window {
            position: fixed; bottom: 120px; right: 30px; width: 380px; height: 520px; 
            background: #0f172a; border-radius: 30px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.4); z-index: 5000; 
            display: none; flex-direction: column; overflow: hidden; 
            border: 2px solid var(--azul-electrico);
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="top-bar-content">
            <span>🚀 SISTEMA ACTUALIZADO 2026</span>
            <span>📍 LA VICTORIA - ARAGUA</span>
            <span>📱 CONTACTO DIRECTO: 0424-33.60.158</span>
        </div>
    </div>

    <header>
        <div class="container" style="display:flex; justify-content:space-between; align-items:center;">
            <div class="header-brand" onclick="window.location.href='index.html'">
                <img src="img/logo.png" alt="Logo" onerror="this.src='img/logo.png'">
                <h1>BotEdu<span>Carmen</span></h1>
            </div>
            <nav>
                <a href="carrito.html" class="nav-btn">VOLVER A SELECCIÓN</a>
            </nav>
        </div>
    </header>

    <div class="form-wrapper">
        <div class="form-card">
            <h2>📋 Registro del Estudiante</h2>
            <p>Ingresa tus datos para completar la postulación a los cursos seleccionados.</p>

            <div class="resumen-cursos">
                <h4>Cursos Seleccionados:</h4>
                <ul id="lista-resumen" class="resumen-lista">
                    <!-- Se carga dinámicamente -->
                </ul>
            </div>

            <form id="form-estudiante" onsubmit="procesarInscripcion(event)">
                <div class="form-group">
                    <label for="nombre">Nombre Completo *</label>
                    <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>
                </div>

                <div class="form-group">
                    <label for="cedula">Cédula de Identidad *</label>
                    <input type="text" id="cedula" placeholder="Ej. V-12345678" required>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono / WhatsApp *</label>
                    <input type="tel" id="telefono" placeholder="Ej. 0412-1234567" required>
                </div>

                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" placeholder="ejemplo@correo.com">
                </div>

                <button type="submit" class="btn-enviar">✅ COMPLETAR INSCRIPCIÓN</button>
            </form>
        </div>
    </div>

    <!-- CHATBOT INTEGRADO -->
    <div id="chat-icon" onclick="toggleChat()">
        <img src="img/chatbot.png" style="width:100%; height:100%; border-radius:50%; box-shadow: 0 4px 15px rgba(0,210,255,0.4);" alt="Chatbot" onerror="this.style.display='none'; document.getElementById('fb').style.display='flex';">
        <div id="fb" style="display:none; width:100%; height:100%; background:rgba(16,29,56,0.9); border-radius:50%; align-items:center; justify-content:center; color:var(--azul-electrico); font-size:32px; border:2px solid var(--azul-electrico);">🤖</div>
    </div>

    <div id="chat-window">
        <div style="background:rgba(5, 12, 24, 0.95); color:var(--azul-electrico); padding:22px; text-align:center; font-weight:800; font-size:1.2rem; letter-spacing: 0.5px; border-bottom: 1px solid var(--borde-cristal);">
            🤖 BOTEDUCARMEN 2026
        </div>
        <div id="chat-messages" style="flex:1; padding:20px; overflow-y:auto; background:#0b1329; display:flex; flex-direction:column; gap:12px;"></div>
        <div style="padding:15px; background:#0f172a; display:flex; gap:10px; border-top: 1px solid var(--borde-cristal);">
            <input type="text" id="user-input" placeholder="Pregunta algo al asistente..." style="flex:1; padding:14px; border:1px solid var(--borde-cristal); background:rgba(10,25,47,0.7); color:white; border-radius:16px; outline:none; font-family: inherit;">
            <button onclick="enviarMensajeChat()" style="background:var(--azul-electrico); color:#0a192f; border:none; width:50px; height:50px; border-radius:16px; cursor:pointer; font-weight:bold; font-size:1.2rem; display:flex; align-items:center; justify-content:center;">➤</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="chatbot.js"></script>

    <script>
        function cargarResumen() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const lista = document.getElementById('lista-resumen');

            if (cart.length === 0) {
                lista.innerHTML = `<li style="color:var(--naranja-neon);">No has seleccionado cursos. <a href="cursos.html" style="color:var(--azul-electrico);">Ir al catálogo</a></li>`;
                return;
            }

            lista.innerHTML = cart.map(c => `<li><strong>${c.nombre}</strong></li>`).join('');
        }

        function procesarInscripcion(e) {
            e.preventDefault();
            const cart = JSON.parse(localStorage.getItem('cart')) || [];

            if (cart.length === 0) {
                alert("Por favor, selecciona al menos un curso antes de inscribirte.");
                window.location.href = "cursos.html";
                return;
            }

            const nombre = document.getElementById('nombre').value;
            const cedula = document.getElementById('cedula').value;
            const telefono = document.getElementById('telefono').value;
            const correo = document.getElementById('correo').value;
            const cursosNombres = cart.map(c => c.nombre).join(', ');

            const nuevoRegistro = {
                id: "TICKET-" + Math.floor(100000 + Math.random() * 900000),
                nombre: nombre,
                cedula: cedula,
                telefono: telefono,
                correo: correo,
                cursos: cursosNombres,
                fecha: new Date().toLocaleString(),
                estado: "Pendiente"
            };

            firebase.database().ref('inscritos').push(nuevoRegistro)
                .then(() => {
                    alert(`¡Felicidades ${nombre}! Tu inscripción ha sido registrada exitosamente.`);
                    localStorage.removeItem('cart');
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    alert("Error al guardar la inscripción: " + error.message);
                });
        }

        document.addEventListener('DOMContentLoaded', cargarResumen);
    </script>
</body>
</html>
