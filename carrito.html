<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos Seleccionados | BotEduCarmen</title>
    <style>
        :root {
            --bg-principal: #0a192f;
            --bg-nav: #e2e8f0; 
            --bg-card: rgba(16, 29, 56, 0.75);
            --texto-oscuro: #0a192f; 
            --texto-principal: #f8fafc;
            --texto-secundario: #94a3b8;
            --azul-electrico: #00d2ff;
            --naranja-neon: #ff6d00;
            --naranja-glow: #ff9100;
            --borde-cristal: rgba(0, 210, 255, 0.15);
            --borde-cristal-hover: rgba(0, 210, 255, 0.4);
        }

        body { 
            background-color: var(--bg-principal); 
            color: var(--texto-principal); 
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* BARRA SUPERIOR CONSTANTE IDENTICA */
        .top-bar {
            background: #050c18;
            color: var(--azul-electrico);
            padding: 10px 0;
            font-size: 0.85rem;
            letter-spacing: 1px;
            font-weight: 600;
            border-bottom: 2px solid var(--azul-electrico);
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.4);
        }
        .top-bar-content {
            display: flex;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 25px;
        }

        /* HEADER CON FONDO AZUL GRISÁCEO */
        header {
            background: var(--bg-nav);
            position: sticky; 
            top: 0; 
            z-index: 1000;
            padding: 15px 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            border-bottom: 2px solid var(--azul-electrico);
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        .header-brand { display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .header-brand img { height: 55px; }
        
        .header-brand h1 { 
            font-size: 1.6rem; 
            margin: 0; 
            color: var(--texto-oscuro); 
            font-weight: 800; 
        }
        .header-brand h1 span { 
            color: #1e3a8a; 
        }

        .nav-btn {
            background: var(--bg-principal);
            border: 2px solid var(--bg-principal);
            color: white;
            padding: 10px 24px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 700;
        }
        .nav-btn:hover { 
            background: transparent;
            color: var(--texto-oscuro);
            border-color: var(--texto-oscuro);
            transform: translateY(-2px);
        }

        /* TÍTULO SECCIÓN */
        .cart-title {
            text-align: center;
            margin: 40px 0 20px;
            font-size: 1.8rem;
            color: var(--azul-electrico);
            font-weight: 800;
        }

        /* GRID DE SELECCIONADOS */
        .cart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px 20px 40px;
        }

        .cart-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--borde-cristal);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .cart-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 15px;
        }

        .cart-card h3 {
            margin: 0 0 15px;
            color: var(--texto-principal);
            font-size: 1.2rem;
        }

        .btn-quitar-cart {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 14px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 0 #991b1b;
            transition: all 0.15s;
        }
        .btn-quitar-cart:hover {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #991b1b;
        }

        /* ACCIONES INFERIORES */
        .cart-actions {
            text-align: center;
            padding: 30px 20px 80px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn-continuar {
            background: linear-gradient(135deg, var(--naranja-neon), var(--naranja-glow));
            color: white;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 18px;
            font-weight: 800;
            box-shadow: 0 6px 0 #b34b00;
            transition: all 0.15s;
        }
        .btn-continuar:hover { transform: translateY(2px); }

        .btn-formulario {
            background: linear-gradient(135deg, #00d2ff, #00a8cc);
            color: #0a192f;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 18px;
            font-weight: 800;
            box-shadow: 0 6px 0 #007799;
            transition: all 0.15s;
        }
        .btn-formulario:hover { transform: translateY(2px); }

        .empty-msg {
            text-align: center;
            font-size: 1.2rem;
            color: var(--texto-secundario);
            margin: 50px 0;
            width: 100%;
        }

        /* CHATBOT INTEGRADO */
        #chat-icon { 
            position: fixed; bottom: 30px; right: 30px; width: 75px; height: 75px; 
            cursor: pointer; z-index: 4000; animation: pulse 2s infinite; 
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

        #chat-window {
            position: fixed; bottom: 120px; right: 30px; width: 380px; height: 520px; 
            background: #0f172a; border-radius: 30px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.4); z-index: 5000; 
            display: none; flex-direction: column; overflow: hidden; 
            border: 2px solid var(--azul-electrico);
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="top-bar-content">
            <span>🚀 SISTEMA ACTUALIZADO 2026</span>
            <span>📍 LA VICTORIA - ARAGUA</span>
            <span>📱 CONTACTO DIRECTO: 0424-33.60.158</span>
        </div>
    </div>

    <header>
        <div class="container" style="display:flex; justify-content:space-between; align-items:center;">
            <div class="header-brand" onclick="window.location.href='index.html'">
                <img src="img/logo.png" alt="Logo" onerror="this.src='img/logo.png'">
                <h1>BotEdu<span>Carmen</span></h1>
            </div>
            <nav>
                <a href="cursos.html" class="nav-btn">VOLVER A CURSOS</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <h2 class="cart-title">🎓 Cursos Seleccionados para Inscripción</h2>
        
        <div id="cart-container" class="cart-grid"></div>

        <div class="cart-actions" id="cart-actions-box">
            <a href="cursos.html" class="btn-continuar">➕ AGREGAR MÁS CURSOS</a>
            <a href="contacto.html" class="btn-formulario">📝 IR AL FORMULARIO DE POSTULACIÓN</a>
        </div>
    </div>

    <!-- CHATBOT -->
    <div id="chat-icon" onclick="toggleChat()">
        <img src="img/chatbot.png" style="width:100%; height:100%; border-radius:50%; box-shadow: 0 4px 15px rgba(0,210,255,0.4);" alt="Chatbot" onerror="this.style.display='none'; document.getElementById('fb').style.display='flex';">
        <div id="fb" style="display:none; width:100%; height:100%; background:rgba(16,29,56,0.9); border-radius:50%; align-items:center; justify-content:center; color:var(--azul-electrico); font-size:32px; border:2px solid var(--azul-electrico);">🤖</div>
    </div>

    <div id="chat-window">
        <div style="background:rgba(5, 12, 24, 0.95); color:var(--azul-electrico); padding:22px; text-align:center; font-weight:800; font-size:1.2rem; letter-spacing: 0.5px; border-bottom: 1px solid var(--borde-cristal);">
            🤖 BOTEDUCARMEN 2026
        </div>
        <div id="chat-messages" style="flex:1; padding:20px; overflow-y:auto; background:#0b1329; display:flex; flex-direction:column; gap:12px;"></div>
        <div style="padding:15px; background:#0f172a; display:flex; gap:10px; border-top: 1px solid var(--borde-cristal);">
            <input type="text" id="user-input" placeholder="Pregunta algo al asistente..." style="flex:1; padding:14px; border:1px solid var(--borde-cristal); background:rgba(10,25,47,0.7); color:white; border-radius:16px; outline:none; font-family: inherit;">
            <button onclick="enviarMensajeChat()" style="background:var(--azul-electrico); color:#0a192f; border:none; width:50px; height:50px; border-radius:16px; cursor:pointer; font-weight:bold; font-size:1.2rem; display:flex; align-items:center; justify-content:center;">➤</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="chatbot.js"></script>

    <script>
        function renderizarCarrito() {
            const container = document.getElementById('cart-container');
            const cart = JSON.parse(localStorage.getItem('cart')) || [];

            if (cart.length === 0) {
                container.innerHTML = `<div class="empty-msg">No has seleccionado ningún curso aún.<br><br><a href="cursos.html" class="btn-continuar">Ver Catálogo de Cursos</a></div>`;
                document.getElementById('cart-actions-box').style.display = 'none';
                return;
            }

            document.getElementById('cart-actions-box').style.display = 'flex';

            container.innerHTML = cart.map((c, index) => {
                const img = c.imagen || 'img/logo.png';
                return `
                    <div class="cart-card">
                        <img src="${img}" onerror="this.src='img/logo.png'">
                        <h3>${c.nombre}</h3>
                        <button class="btn-quitar-cart" onclick="eliminarDelCarrito(${index})">✖ ELIMINAR</button>
                    </div>
                `;
            }).join('');
        }

        function eliminarDelCarrito(index) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderizarCarrito();
        }

        document.addEventListener('DOMContentLoaded', renderizarCarrito);
    </script>
</body>
</html>
